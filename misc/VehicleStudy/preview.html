 for(const part of asset.partsData){for(const v of part.positions)for(let i=0;i<3;i++){min[i]=Math.min(min[i],v[i]);max[i]=Math.max(max[i],v[i]);}const edges=[];for(let i=0;i<part.indices.length;i+=3){const [a,b,c]=part.indices.slice(i,i+3);edges.push(a,b,b,c,c,a);}const hex=data.palette[part.material];meshBuffers.push({p:buffer(part.positions,gl.ARRAY_BUFFER),n:buffer(part.normals,gl.ARRAY_BUFFER),i:buffer(part.indices,gl.ELEMENT_ARRAY_BUFFER),lines:buffer(edges,gl.ELEMENT_ARRAY_BUFFER),count:part.indices.length,lineCount:edges.length,color:[1,3,5].map(x=>parseInt(hex.slice(x,x+2),16)/255)});}
 bounds={min,max,center:min.map((v,i)=>(v+max[i])/2)};yaw=.68;pitch=.40;scale=1;
 document.querySelector('#name').textContent=asset.name;document.querySelector('#stats').textContent=`${asset.triangles.toLocaleString()} TRIANGLES / ${asset.materials} COLORS`;
 const link=document.querySelector('#download');link.href=asset.file;link.download=asset.id+'.glb';document.querySelectorAll('.choice').forEach((e,i)=>{e.classList.toggle('active',i===index);e.setAttribute('aria-pressed',String(i===index));});
}
data.models.forEach((m,i)=>{const b=document.createElement('button');b.className='choice';b.innerHTML=`<small>0${i+1} / VEHICLE</small><strong>${m.name}</strong><em>${m.subtitle}</em>`;b.onclick=()=>select(i);document.querySelector('#choices').append(b);});
for(const [key,color] of Object.entries(data.palette)){const e=document.createElement('span');e.className='swatch';e.style.background=color;e.title=color;document.querySelector('#swatches').append(e);}
document.querySelector('#three').onclick=()=>{yaw=.68;pitch=.40;scale=1;};document.querySelector('#side').onclick=()=>{yaw=0;pitch=0;scale=1;};document.querySelector('#top').onclick=()=>{yaw=0;pitch=Math.PI/2;scale=1;};
document.querySelector('#wire').onclick=function(){wire=!wire;this.classList.toggle('on',wire);this.setAttribute('aria-pressed',wire);};document.querySelector('#spin').onclick=function(){spin=!spin;this.classList.toggle('on',spin);this.setAttribute('aria-pressed',spin);};
const pointers=new Map();let pinch=0;canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,[e.clientX,e.clientY]);pinch=0;});
canvas.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;const old=pointers.get(e.pointerId);pointers.set(e.pointerId,[e.clientX,e.clientY]);if(pointers.size===1){yaw+=(e.clientX-old[0])*.009;pitch=Math.max(-1.55,Math.min(1.55,pitch+(e.clientY-old[1])*.009));}else{const a=[...pointers.values()];const dist=Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]);if(pinch)scale=Math.max(.55,Math.min(3,scale*dist/pinch));pinch=dist;}});
for(const event of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(event,e=>{pointers.delete(e.pointerId);pinch=0;});canvas.addEventListener('wheel',e=>{e.preventDefault();scale=Math.max(.55,Math.min(3,scale*Math.exp(-e.deltaY*.001)));},{passive:false});canvas.ondblclick=()=>{yaw=.68;pitch=.40;scale=1;};window.addEventListener('keydown',e=>{const index=Number(e.key)-1;if(/^[1-9]$/.test(e.key)&&index<data.models.length)select(index);});
let previous=0;function draw(time){const dt=Math.min((time-previous)/1000,.05);previous=time;if(spin)yaw+=dt*.35;const ratio=Math.min(devicePixelRatio,2),w=Math.round(canvas.clientWidth*ratio),h=Math.round(canvas.clientHeight*ratio);if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;}gl.viewport(0,0,w,h);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);const aspect=w/h,c=Math.cos(yaw),s=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch);const r=[c,0,-s],u=[-s*sp,cp,-c*sp],f=[s*cp,sp,c*cp];
 const extent=bounds.max.map((v,i)=>v-bounds.min[i]);
 const projectedW=extent.reduce((sum,v,i)=>sum+Math.abs(r[i])*v,0),projectedH=extent.reduce((sum,v,i)=>sum+Math.abs(u[i])*v,0);
 fit=Math.min(1.58*aspect/projectedW,1.12/projectedH);gl.uniform3fv(uniforms.center,bounds.center);gl.uniform3fv(uniforms.right,r);gl.uniform3fv(uniforms.up,u);gl.uniform3fv(uniforms.forward,f);gl.uniform1f(uniforms.zoom,fit*scale);gl.uniform1f(uniforms.aspect,aspect);
 for(const b of meshBuffers){gl.bindBuffer(gl.ARRAY_BUFFER,b.p);gl.vertexAttribPointer(pos,3,gl.FLOAT,false,0,0);gl.bindBuffer(gl.ARRAY_BUFFER,b.n);gl.vertexAttribPointer(nor,3,gl.FLOAT,false,0,0);gl.uniform3fv(uniforms.color,b.color);gl.uniform1f(uniforms.wire,0);gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,b.i);gl.drawElements(gl.TRIANGLES,b.count,gl.UNSIGNED_SHORT,0);if(wire){gl.uniform1f(uniforms.wire,1);gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,b.lines);gl.drawElements(gl.LINES,b.lineCount,gl.UNSIGNED_SHORT,0);}}

const initialId=location.hash.slice(1)||'sedan';select(Math.max(0,data.models.findIndex(m=>m.id===initialId)));requestAnimationFrame(draw);
window.__previewState=()=>({selected,dataReady:true,models:data.models.length,wire,spin,yaw,pitch,scale,error:gl.getError()});
</script></body></html>
