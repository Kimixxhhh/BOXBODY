<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FIELD / ARMORY — 3D 模型预览</title>
<style>
:root{color-scheme:light;--ink:#283238;--muted:#7a817b;--paper:#eeebe2;--line:#d4d6cc;--accent:#ad7046}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Bahnschrift,"Microsoft YaHei",sans-serif}button,a{-webkit-tap-highlight-color:transparent}button{font:inherit;cursor:pointer;border:1px solid var(--line);background:transparent;color:inherit;transition:background .15s,border-color .15s}button:hover{background:#d9dbd0}button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:4px}header{height:104px;border-bottom:1px solid var(--line);padding:30px 40px;display:flex;align-items:center;justify-content:space-between}.brand{font-size:24px;font-weight:700;letter-spacing:1.5px}.brand span{font-size:12px;font-weight:400;display:block;letter-spacing:2px;margin-top:7px;color:var(--muted)}.badge{font-size:12px;letter-spacing:1px;border:1px solid #c6ccbf;border-radius:30px;padding:9px 14px}main{display:grid;grid-template-columns:278px 1fr;height:calc(100vh - 104px);min-height:560px}aside{border-right:1px solid var(--line);padding:30px 22px;display:flex;flex-direction:column;gap:11px}.eyebrow{font-size:11px;letter-spacing:2px;color:var(--muted);margin:8px 0 17px}.choice{text-align:left;border:1px solid transparent;border-radius:8px;padding:19px 17px}.choice.active{border-color:#b8c0b4;background:#e1e3d8}.choice small{display:block;color:var(--muted);font-size:10px;letter-spacing:2px;margin-bottom:8px}.choice strong{font-size:25px;letter-spacing:1px}.choice em{display:block;font-style:normal;font-size:12px;color:var(--muted);margin-top:9px}.palette{margin-top:auto;padding:28px 6px 0;border-top:1px solid var(--line)}.swatches{display:flex;gap:8px}.swatch{width:31px;height:31px;border-radius:5px}.palette p{font-size:11px;color:var(--muted);line-height:1.8}.stage{position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 42%,#f8f5ec 0%,#e6e5da 70%,#dcded3 100%)}canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}canvas:active{cursor:grabbing}.heading{position:absolute;top:34px;left:38px;pointer-events:none}.heading h1{font-size:44px;font-weight:600;margin:0 0 8px;letter-spacing:1px}.heading p{font-size:12px;color:var(--muted);margin:0;letter-spacing:1px}.toolbar{position:absolute;right:30px;top:33px;display:flex;gap:6px}.toolbar button{font-size:12px;padding:10px 14px;border-radius:5px;background:#f3f1e9dd}.toolbar button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}.bottom{position:absolute;bottom:28px;left:38px;right:32px;display:flex;align-items:flex-end;justify-content:space-between;gap:20px}.hint{font-size:12px;color:#737c74;line-height:2}.hint b{font-weight:400;color:var(--ink)}.download{background:var(--ink);color:var(--paper);padding:14px 22px;text-decoration:none;font-size:13px;border-radius:5px;white-space:nowrap}.download:hover{background:#46514e}.axis{position:absolute;bottom:90px;right:40px;color:#858c80;font-size:10px;letter-spacing:1px}#error{display:none;position:absolute;inset:40%;font-size:16px} @media(max-width:850px){header{padding:20px;height:90px}.badge{display:none}main{height:calc(100vh - 90px);grid-template-columns:190px 1fr}aside{padding:20px 10px}.choice{padding:15px 10px}.choice strong{font-size:21px}.choice em{font-size:10px}.heading{left:22px;top:25px}.heading h1{font-size:32px}.toolbar{top:115px;left:22px;right:auto;flex-wrap:wrap}.toolbar button{padding:8px 10px}.bottom{left:22px;right:22px;flex-direction:column;align-items:flex-start}.hint{font-size:10px}.axis{display:none}} @media(max-width:540px){main{display:flex;flex-direction:column}aside{flex-direction:row;border-right:0;border-bottom:1px solid var(--line);padding:8px;gap:4px}.choice{flex:1;padding:9px}.choice small,.choice em,aside>.eyebrow,.palette{display:none}.choice strong{font-size:18px}.stage{flex:1;min-height:480px}.heading h1{font-size:28px}.toolbar{top:90px}.bottom{bottom:16px}.hint{line-height:1.5}}
</style></head><body>
<header><div class="brand">FIELD / ARMORY<span>LOW-POLY WEAPON STUDY / 01</span></div><div class="badge">原创模型 · 五色调色板</div></header>
<main><aside><div class="eyebrow">SELECT ASSET / 选择模型</div><div id="choices" style="display:contents"></div><div class="palette"><div class="swatches" id="swatches"></div><p>5 种基础色 · 纯色材质<br>拖动观察棱面，切换线框查看结构。</p></div></aside>
<section class="stage"><canvas id="viewport" aria-label="交互式三维武器模型，拖动旋转，滚轮缩放"></canvas><div class="heading"><h1 id="name"></h1><p id="stats"></p></div>
<div class="toolbar"><button id="three">三维</button><button id="side">侧视</button><button id="top">俯视</button><button id="wire" aria-pressed="false">线框</button><button id="spin" aria-pressed="false">自动旋转</button></div>
<div class="axis">Y ↑ &nbsp; / &nbsp; GLB FORWARD −Z</div><div class="bottom"><div class="hint"><b>拖动</b> 旋转 &nbsp; / &nbsp; <b>滚轮或双指</b> 缩放 &nbsp; / &nbsp; <b>双击</b> 复位<br><b>1 · 2 · 3</b> 切换模型 &nbsp; · &nbsp; 无需联网即可查看</div><a id="download" class="download" download>下载 GLB &nbsp; ↗</a></div><div id="error">浏览器无法启用 WebGL，请打开 previews 文件夹查看静态预览。</div></section></main>
<script id="asset-data" type="application/json">__ASSET_DATA__</script>
<script>
'use strict';
const data=JSON.parse(document.querySelector('#asset-data').textContent);
const canvas=document.querySelector('#viewport');const gl=canvas.getContext('webgl',{antialias:true,alpha:true,preserveDrawingBuffer:true});
if(!gl){document.querySelector('#error').style.display='block';throw Error('WebGL unavailable');}
const vs=`precision mediump float;attribute vec3 position;attribute vec3 normal;uniform vec3 center;uniform vec3 right;uniform vec3 up;uniform vec3 forward;uniform float zoom;uniform float aspect;uniform float wire;varying vec3 n;void main(){vec3 p=position-center;n=vec3(dot(normal,right),dot(normal,up),dot(normal,forward));gl_Position=vec4(dot(p,right)*zoom/aspect,dot(p,up)*zoom,-dot(p,forward)*.35-wire*.0001,1.);}`;
const fs=`precision mediump float;varying vec3 n;uniform vec3 color;uniform float wire;void main(){vec3 normal=normalize(n);float shade=.68+.39*max(0.,dot(normal,normalize(vec3(-.35,.8,1.2))))+.06*max(0.,normal.y);gl_FragColor=vec4(mix(color*shade,vec3(.23,.30,.26),wire),1.);}`;
function shader(type,source){const s=gl.createShader(type);gl.shaderSource(s,source);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s;}
const program=gl.createProgram();gl.attachShader(program,shader(gl.VERTEX_SHADER,vs));gl.attachShader(program,shader(gl.FRAGMENT_SHADER,fs));gl.linkProgram(program);if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(program));gl.useProgram(program);
const uniforms={};for(const x of ['center','right','up','forward','zoom','aspect','color','wire'])uniforms[x]=gl.getUniformLocation(program,x);
const pos=gl.getAttribLocation(program,'position'),nor=gl.getAttribLocation(program,'normal');gl.enableVertexAttribArray(pos);gl.enableVertexAttribArray(nor);gl.enable(gl.DEPTH_TEST);gl.enable(gl.CULL_FACE);gl.cullFace(gl.BACK);gl.clearColor(0,0,0,0);
let yaw=.314,pitch=.228,scale=1,wire=false,spin=false,selected=0,meshBuffers=[],bounds,fit=2;
function buffer(values,type){const b=gl.createBuffer();gl.bindBuffer(type,b);gl.bufferData(type,type===gl.ARRAY_BUFFER?new Float32Array(values.flat()):new Uint16Array(values),gl.STATIC_DRAW);return b;}
function select(index){selected=index;for(const p of meshBuffers)for(const k of ['p','n','i','lines'])gl.deleteBuffer(p[k]);meshBuffers=[];const asset=data.models[index];let min=[Infinity,Infinity,Infinity],max=[-Infinity,-Infinity,-Infinity];
 for(const part of asset.partsData){for(const v of part.positions)for(let i=0;i<3;i++){min[i]=Math.min(min[i],v[i]);max[i]=Math.max(max[i],v[i]);}const edges=[];for(let i=0;i<part.indices.length;i+=3){const [a,b,c]=part.indices.slice(i,i+3);edges.push(a,b,b,c,c,a);}const hex=data.palette[part.material];meshBuffers.push({p:buffer(part.positions,gl.ARRAY_BUFFER),n:buffer(part.normals,gl.ARRAY_BUFFER),i:buffer(part.indices,gl.ELEMENT_ARRAY_BUFFER),lines:buffer(edges,gl.ELEMENT_ARRAY_BUFFER),count:part.indices.length,lineCount:edges.length,color:[1,3,5].map(x=>parseInt(hex.slice(x,x+2),16)/255)});}
 bounds={min,max,center:min.map((v,i)=>(v+max[i])/2)};yaw=.314;pitch=.228;scale=1;
 document.querySelector('#name').textContent=asset.name;document.querySelector('#stats').textContent=`${asset.triangles.toLocaleString()} TRIANGLES / ${asset.materials} COLORS`;
 const link=document.querySelector('#download');link.href=asset.file;link.download=asset.id+'.glb';document.querySelectorAll('.choice').forEach((e,i)=>{e.classList.toggle('active',i===index);e.setAttribute('aria-pressed',String(i===index));});
}
data.models.forEach((m,i)=>{const b=document.createElement('button');b.className='choice';b.innerHTML=`<small>0${i+1} / WEAPON</small><strong>${m.name}</strong><em>${m.subtitle}</em>`;b.onclick=()=>select(i);document.querySelector('#choices').append(b);});
for(const [key,color] of Object.entries(data.palette)){const e=document.createElement('span');e.className='swatch';e.style.background=color;e.title=color;document.querySelector('#swatches').append(e);}
document.querySelector('#three').onclick=()=>{yaw=.314;pitch=.228;scale=1;};document.querySelector('#side').onclick=()=>{yaw=0;pitch=0;scale=1;};document.querySelector('#top').onclick=()=>{yaw=0;pitch=Math.PI/2;scale=1;};
document.querySelector('#wire').onclick=function(){wire=!wire;this.classList.toggle('on',wire);this.setAttribute('aria-pressed',wire);};document.querySelector('#spin').onclick=function(){spin=!spin;this.classList.toggle('on',spin);this.setAttribute('aria-pressed',spin);};
const pointers=new Map();let pinch=0;canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,[e.clientX,e.clientY]);pinch=0;});
canvas.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;const old=pointers.get(e.pointerId);pointers.set(e.pointerId,[e.clientX,e.clientY]);if(pointers.size===1){yaw+=(e.clientX-old[0])*.009;pitch=Math.max(-1.55,Math.min(1.55,pitch+(e.clientY-old[1])*.009));}else{const a=[...pointers.values()];const dist=Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]);if(pinch)scale=Math.max(.55,Math.min(3,scale*dist/pinch));pinch=dist;}});
for(const event of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(event,e=>{pointers.delete(e.pointerId);pinch=0;});canvas.addEventListener('wheel',e=>{e.preventDefault();scale=Math.max(.55,Math.min(3,scale*Math.exp(-e.deltaY*.001)));},{passive:false});canvas.ondblclick=()=>{yaw=.314;pitch=.228;scale=1;};window.addEventListener('keydown',e=>{if('123'.includes(e.key))select(Number(e.key)-1);});
let previous=0;function draw(time){const dt=Math.min((time-previous)/1000,.05);previous=time;if(spin)yaw+=dt*.35;const ratio=Math.min(devicePixelRatio,2),w=Math.round(canvas.clientWidth*ratio),h=Math.round(canvas.clientHeight*ratio);if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;}gl.viewport(0,0,w,h);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);const aspect=w/h,c=Math.cos(yaw),s=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch);const r=[c,0,-s],u=[-s*sp,cp,-c*sp],f=[s*cp,sp,c*cp];
 const length=bounds.max[0]-bounds.min[0];fit=Math.min(1.45*aspect/length,1.0/(bounds.max[1]-bounds.min[1]+length*.14));gl.uniform3fv(uniforms.center,bounds.center);gl.uniform3fv(uniforms.right,r);gl.uniform3fv(uniforms.up,u);gl.uniform3fv(uniforms.forward,f);gl.uniform1f(uniforms.zoom,fit*scale);gl.uniform1f(uniforms.aspect,aspect);
 for(const b of meshBuffers){gl.bindBuffer(gl.ARRAY_BUFFER,b.p);gl.vertexAttribPointer(pos,3,gl.FLOAT,false,0,0);gl.bindBuffer(gl.ARRAY_BUFFER,b.n);gl.vertexAttribPointer(nor,3,gl.FLOAT,false,0,0);gl.uniform3fv(uniforms.color,b.color);gl.uniform1f(uniforms.wire,0);gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,b.i);gl.drawElements(gl.TRIANGLES,b.count,gl.UNSIGNED_SHORT,0);if(wire){gl.uniform1f(uniforms.wire,1);gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,b.lines);gl.drawElements(gl.LINES,b.lineCount,gl.UNSIGNED_SHORT,0);}}
 requestAnimationFrame(draw);}
select(0);requestAnimationFrame(draw);
window.__previewState=()=>({selected,dataReady:true,models:data.models.length,wire,spin,yaw,pitch,scale,error:gl.getError()});
</script></body></html>
